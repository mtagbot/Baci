; ─────────────────────────────────────────────────────────────────────────────
; SchoolDesk Pro — تنظیمات پیشنهادی PHP برای حداکثر سرعت (V4.208.0)
; ─────────────────────────────────────────────────────────────────────────────
; این مقادیر را در php.ini یا در فایل conf.d اضافه کنید و PHP-FPM را restart کنید.
; (روی هاست اشتراکی معمولاً فقط بخش OPcache قابل تنظیم است.)
; ─────────────────────────────────────────────────────────────────────────────

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; پس از هر آپدیت سایت، PHP-FPM را restart کنید تا کد تازه دیده شود.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

[realpath]
; مقدار پیش‌فرض 4096 بایت است و برای این تعداد فایل بسنده نیست؛
; بزرگ‌تر بودنش یعنی stat کمتر روی دیسک در هر درخواست.
realpath_cache_size=4M
realpath_cache_ttl=600

[output]
output_buffering=4096
; فشرده‌سازی را nginx/Apache انجام دهد، نه PHP
zlib.output_compression=0

[session]
session.gc_probability=1
session.gc_divisor=1000
; نشست‌ها روی tmpfs یا SSD باشند
;session.save_path="/var/lib/php/sessions"

; [apcu] — اگر نصب است (اختیاری)
; apc.enabled=1
; apc.shm_size=64M
