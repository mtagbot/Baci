# ─────────────────────────────────────────────────────────────────────────────
# SchoolDesk Pro — تنظیمات پیشنهادی nginx برای حداکثر سرعت (V4.208.0)
# ─────────────────────────────────────────────────────────────────────────────
# این بلوک را داخل server { ... } سایت قرار دهید و nginx را reload کنید:
#     sudo nginx -t && sudo systemctl reload nginx
#
# سه هدف اصلی:
#   ۱) فایل استاتیکِ گم‌شده هرگز به PHP نرسد.
#      در trace واقعی، درخواست فونتی که روی سرور نبود، با ۷۲۵ میلی‌ثانیه
#      پاسخ داده شد چون nginx آن را به PHP فرستاد و کل برنامه اجرا شد
#      (پاسخ ۲۰۰ + HTML به‌جای ۴۰۴ + فونت).
#   ۲) CSS/JS/فونت با کش یک‌ساله و immutable سرو شوند (بدون رفت‌وبرگشت
#      شرطی به سرور در هر بازدید).
#   ۳) فشرده‌سازی gzip/brotli و کش مسیر فایل‌ها (open_file_cache).
#
# نکته: اگر سایت شما در زیرمسیر نصب شده است (مثلاً /school/)، همهٔ
# locationها باید با همان پیشوند نوشته شوند.
# ─────────────────────────────────────────────────────────────────────────────

# ── فشرده‌سازی ──
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/xml+rss image/svg+xml font/woff2 font/ttf;

# اگر ماژول brotli نصب است (توصیه می‌شود؛ برای متن فارسی ۱۰–۲۰٪ بهتر از gzip):
# brotli on;
# brotli_comp_level 5;
# brotli_types text/css application/javascript application/json image/svg+xml;

# ── دارایی‌های استاتیک ──
# try_files $uri =404 مهم‌ترین خط این فایل است: فایل گم‌شده = ۴۰۴ سریع
# (چند میکروثانیه از دیسک) به‌جای اجرای کامل PHP (صدها میلی‌ثانیه).
location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /uploads/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# باندل‌های ساخته‌شده در assets/cache همین قاعده را دارند (نامشان هش‌دار است)
location ^~ /assets/cache/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── امنیت مسیرهای حساس ──
location ~* ^/(config|includes|sql|backups|cache|perf-config)/.*\.(php|phtml|inc|ini|conf|sql|md)$ { deny all; }
location ~ /\.(?!well-known) { deny all; }

# ── کش مسیر فایل‌های سیستم ──
open_file_cache          max=4000 inactive=60s;
open_file_cache_valid    30s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# ── PHP ──
location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    # مسیر واقعی PHP-FPM خود را بگذارید:
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 60s;
}

# ── کش صفحه برای صفحات عمومی (اختیاری) ──
# اگر فقط از پنل استفاده می‌کنید لازم نیست؛ برای صفحهٔ ورود و صفحات بدون
# نشست می‌توانید fastcgi_cache را فعال کنید. نمونه:
# fastcgi_cache_path /var/cache/nginx/schooldesk levels=1:2 keys_zone=sd:32m inactive=60m;
# fastcgi_cache_key "$scheme$request_method$host$request_uri";
# سپس داخل location ~ \.php$ اضافه کنید:
#   fastcgi_cache sd;
#   fastcgi_cache_valid 200 60s;
#   fastcgi_cache_bypass $cookie_PHPSESSID;
#   fastcgi_no_cache     $cookie_PHPSESSID;
