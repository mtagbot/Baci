name: Build Scanner APK

# ساختِ خودکار APK اسکنر اندروید روی سرور GitHub — بدون نیاز به Android Studio محلی.
# خروجی: artifact به نام scanner-apk شامل app-debug.apk
# اگر build شکست بخورد، لاگ کامل در فایل scanner-build-log.txt روی همان برنچ commit می‌شود.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-scanner.yml'
      - 'SchoolDesk-Scanner-Android-V1.0-source.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source
        run: |
          mkdir -p android-src
          unzip -q SchoolDesk-Scanner-Android-V1.0-source.zip -d android-src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: |
          cd android-src/SchoolDeskScanner
          set +e
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          CODE=$?
          set -e
          cat /tmp/build.log
          exit $CODE

      - name: Publish build log on failure
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          cp /tmp/build.log scanner-build-log.txt
          git config user.name "ci-log"
          git config user.email "ci-log@example.com"
          git add scanner-build-log.txt
          git commit -m "ci: لاگ build اسکنر (ناموفق)" && git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanner-apk
          path: android-src/SchoolDeskScanner/app/build/outputs/apk/debug/app-debug.apk
